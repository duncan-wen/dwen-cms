<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)"/>
    </marker>
  </defs>

  <!-- Title row: what the picture shows, in one line. -->
  <text x="24" y="32" font-size="16" font-weight="600" fill="var(--ink)">同一顆 CPU，兩條執行緒輪流拿到 GIL</text>

  <!-- Lane labels. -->
  <text x="24" y="94" fill="var(--ink)">執行緒 A</text>
  <text x="24" y="154" fill="var(--ink)">執行緒 B</text>

  <!-- Lanes: a faint track, then the slices each thread actually ran. -->
  <rect x="104" y="76" width="512" height="28" rx="6" fill="var(--paper-deep)"/>
  <rect x="104" y="136" width="512" height="28" rx="6" fill="var(--paper-deep)"/>

  <rect x="104" y="76" width="120" height="28" rx="6" fill="var(--series-1)"/>
  <rect x="352" y="76" width="120" height="28" rx="6" fill="var(--series-1)"/>
  <rect x="228" y="136" width="120" height="28" rx="6" fill="var(--series-2)"/>
  <rect x="476" y="136" width="140" height="28" rx="6" fill="var(--series-2)"/>

  <text x="164" y="95" text-anchor="middle" fill="var(--on-accent)">執行</text>
  <text x="412" y="95" text-anchor="middle" fill="var(--on-accent)">執行</text>
  <text x="288" y="155" text-anchor="middle" fill="var(--on-accent)">執行</text>
  <text x="546" y="155" text-anchor="middle" fill="var(--on-accent)">執行</text>

  <!-- Hand-offs: where the GIL passes from one thread to the other. -->
  <path d="M226 106 L226 132" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M350 134 L350 108" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M474 106 L474 132" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Time axis. -->
  <path d="M104 196 L616 196" stroke="var(--rule)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="616" y="220" text-anchor="end" fill="var(--ink-soft)">時間</text>

  <!-- The takeaway, highlighted once with the accent. -->
  <rect x="24" y="236" width="592" height="32" rx="6" fill="var(--accent-wash)"/>
  <text x="40" y="257" fill="var(--accent)">任何時刻只有一條在跑：CPU 密集的工作不會因為多開執行緒而變快</text>
</svg>
