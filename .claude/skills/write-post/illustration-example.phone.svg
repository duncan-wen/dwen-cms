<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-soft)"/>
    </marker>
  </defs>

  <!-- The same picture as illustration-example.svg, upright: time runs down instead of across. -->
  <text x="16" y="28" font-size="16" font-weight="600" fill="var(--ink)">兩條執行緒輪流拿到 GIL</text>

  <!-- Lane labels. -->
  <text x="130" y="66" text-anchor="middle" fill="var(--ink)">執行緒 A</text>
  <text x="250" y="66" text-anchor="middle" fill="var(--ink)">執行緒 B</text>

  <!-- Lanes: a faint track, then the slices each thread actually ran. -->
  <rect x="90" y="80" width="80" height="300" rx="6" fill="var(--paper-deep)"/>
  <rect x="210" y="80" width="80" height="300" rx="6" fill="var(--paper-deep)"/>

  <rect x="90" y="80" width="80" height="70" rx="6" fill="var(--series-1)"/>
  <rect x="90" y="228" width="80" height="70" rx="6" fill="var(--series-1)"/>
  <rect x="210" y="154" width="80" height="70" rx="6" fill="var(--series-2)"/>
  <rect x="210" y="302" width="80" height="78" rx="6" fill="var(--series-2)"/>

  <text x="130" y="120" text-anchor="middle" fill="var(--on-accent)">執行</text>
  <text x="130" y="268" text-anchor="middle" fill="var(--on-accent)">執行</text>
  <text x="250" y="194" text-anchor="middle" fill="var(--on-accent)">執行</text>
  <text x="250" y="346" text-anchor="middle" fill="var(--on-accent)">執行</text>

  <!-- Hand-offs: where the GIL passes from one thread to the other. -->
  <path d="M172 152 L206 152" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M208 226 L174 226" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M172 300 L206 300" stroke="var(--ink-soft)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Time axis. -->
  <path d="M44 80 L44 380" stroke="var(--rule)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="44" y="402" text-anchor="middle" fill="var(--ink-soft)">時間</text>

  <!-- The takeaway, highlighted once with the accent. -->
  <rect x="16" y="414" width="308" height="56" rx="6" fill="var(--accent-wash)"/>
  <text x="28" y="437" fill="var(--accent)">任何時刻只有一條在跑：</text>
  <text x="28" y="459" fill="var(--accent)">CPU 密集的工作不會因為多開執行緒而變快</text>
</svg>
