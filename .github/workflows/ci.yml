name: CI

on:
  pull_request:
    # edited: re-run when a PR is retargeted to another base.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  base-is-main:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PRs merge into main
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "::error::This PR targets '$BASE'. Merging it would never reach main; retarget it with: gh pr edit --base main"
            exit 1
          fi
  check:
    runs-on: ubuntu-latest
    # Playwright's image ships Chromium's system packages and fonts, so no apt
    # download can fail mid-run. Keep its tag at the lockfile's @playwright/test.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next build fetches its Google Fonts on every fresh runner, and fails when
      # Google doesn't answer. Turbopack's cache holds them, so restoring it lets
      # the build run without reaching Google (an offline build with it passes).
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**', 'e2e/content/**') }}
          restore-keys: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm check
      - name: Build real content (fails on warnings)
        run: pnpm build:check
      - name: Chromium for the smoke tests (already in the image when versions match)
        run: pnpm exec playwright install chromium
      - name: Smoke tests (builds e2e/content)
        run: pnpm smoke
