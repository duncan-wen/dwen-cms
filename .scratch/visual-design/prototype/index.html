<title>dwen-cms 視覺方向</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway. 問題：dwen-cms 的視覺方向該選哪一個？
  三個方向（A 編輯 / B 工程筆記 / C 極簡現代）× 三個代表頁（首頁 / 文章列表 / 文章內頁），
  底部浮動列切換；← → 鍵切換方向；網址 hash 形如 #a-home、#b-post。
  文章內頁用真實文章 why-mdx-in-git；列表裡其他四篇是範例標題；程式碼區塊是示意內容。
-->

<style>
/* 版面概念：每個方向各自掌管版面；token 依方向（html class）與主題切換。 */
:root {
  --bg: #f7f6f2; --surface: #efeee8; --fg: #1d2722; --muted: #5a665f; --line: #dcdcd3; --accent: #2f5d46; --accent-soft: #e2ebe4;
  --code-bg: #f0efe8; --code-fg: #26302b; --tk-k: #8a3b5c; --tk-s: #2f6b3f; --tk-c: #8a918c; --tk-f: #2b5c8a; --tk-t: #8a5a1c;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --font-serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-display: var(--font-serif);
  --bar-bg: #111; --bar-fg: #fff; --bar-muted: #9a9a9a; --bar-active: #fff; --bar-active-fg: #111;
}
:root.no-serif { --font-display: var(--font-sans); }

/* A 編輯：紙感、墨綠 */
:root.v-a { --bg: #f7f6f2; --surface: #efeee8; --fg: #1d2722; --muted: #5a665f; --line: #dcdcd3; --accent: #2f5d46; --accent-soft: #e2ebe4;
  --code-bg: #efeee7; --code-fg: #26302b; --tk-k: #8a3b5c; --tk-s: #2f6b3f; --tk-c: #8a918c; --tk-f: #2b5c8a; --tk-t: #8a5a1c; }
/* B 工程筆記：冷灰、青藍、等寬點綴 */
:root.v-b { --bg: #f4f6f8; --surface: #ffffff; --fg: #16202a; --muted: #5a6877; --line: #dbe1e8; --accent: #0a6a86; --accent-soft: #e0eff4;
  --code-bg: #ffffff; --code-fg: #1d2833; --tk-k: #a2338a; --tk-s: #1f7a4d; --tk-c: #8793a0; --tk-f: #0a6a86; --tk-t: #b5541b; }
/* C 極簡現代：純白純黑、藍色只給連結 */
:root.v-c { --bg: #ffffff; --surface: #f4f4f4; --fg: #0b0b0b; --muted: #6a6a6a; --line: #e6e6e6; --accent: #2440e6; --accent-soft: #eef0ff;
  --code-bg: #f5f5f5; --code-fg: #111; --tk-k: #2440e6; --tk-s: #0b0b0b; --tk-c: #8c8c8c; --tk-f: #0b0b0b; --tk-t: #2440e6; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bar-bg: #f2f2f2; --bar-fg: #111; --bar-muted: #666; --bar-active: #111; --bar-active-fg: #fff; }
  :root.v-a:not([data-theme="light"]) { --bg: #131715; --surface: #1b201d; --fg: #e3e6e1; --muted: #9aa49e; --line: #2c3430; --accent: #8cc2a4; --accent-soft: #1f2d25;
    --code-bg: #1a1f1c; --code-fg: #dfe3dd; --tk-k: #e29bb8; --tk-s: #9ccf9f; --tk-c: #6f7a74; --tk-f: #93bde6; --tk-t: #e0b77a; }
  :root.v-b:not([data-theme="light"]) { --bg: #0e1318; --surface: #151c23; --fg: #d9e1e9; --muted: #8796a6; --line: #24303b; --accent: #5cc3dc; --accent-soft: #14303a;
    --code-bg: #121920; --code-fg: #d3dce5; --tk-k: #e08cd0; --tk-s: #7fd1a1; --tk-c: #66737f; --tk-f: #5cc3dc; --tk-t: #f0a46e; }
  :root.v-c:not([data-theme="light"]) { --bg: #0a0a0a; --surface: #161616; --fg: #f2f2f2; --muted: #9a9a9a; --line: #262626; --accent: #8fa0ff; --accent-soft: #171b33;
    --code-bg: #141414; --code-fg: #ededed; --tk-k: #8fa0ff; --tk-s: #f2f2f2; --tk-c: #777; --tk-f: #f2f2f2; --tk-t: #8fa0ff; }
}
:root[data-theme="dark"] { color-scheme: dark; --bar-bg: #f2f2f2; --bar-fg: #111; --bar-muted: #666; --bar-active: #111; --bar-active-fg: #fff; }
:root.v-a[data-theme="dark"] { --bg: #131715; --surface: #1b201d; --fg: #e3e6e1; --muted: #9aa49e; --line: #2c3430; --accent: #8cc2a4; --accent-soft: #1f2d25;
  --code-bg: #1a1f1c; --code-fg: #dfe3dd; --tk-k: #e29bb8; --tk-s: #9ccf9f; --tk-c: #6f7a74; --tk-f: #93bde6; --tk-t: #e0b77a; }
:root.v-b[data-theme="dark"] { --bg: #0e1318; --surface: #151c23; --fg: #d9e1e9; --muted: #8796a6; --line: #24303b; --accent: #5cc3dc; --accent-soft: #14303a;
  --code-bg: #121920; --code-fg: #d3dce5; --tk-k: #e08cd0; --tk-s: #7fd1a1; --tk-c: #66737f; --tk-f: #5cc3dc; --tk-t: #f0a46e; }
:root.v-c[data-theme="dark"] { --bg: #0a0a0a; --surface: #161616; --fg: #f2f2f2; --muted: #9a9a9a; --line: #262626; --accent: #8fa0ff; --accent-soft: #171b33;
  --code-bg: #141414; --code-fg: #ededed; --tk-k: #8fa0ff; --tk-s: #f2f2f2; --tk-c: #777; --tk-f: #f2f2f2; --tk-t: #8fa0ff; }

body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 16px; line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px; transition: background .2s, color .2s; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
time { font-variant-numeric: tabular-nums; }

/* 共用：文章內文與程式碼 */
.prose { font-size: 17px; line-height: 1.9; display: grid; gap: 1.15em; min-width: 0; }
.prose h2 { font-size: 1.35em; line-height: 1.4; margin-top: .9em; }
.prose ul { display: grid; gap: .5em; padding-left: 1.3em; list-style: disc; }
.prose li::marker { color: var(--accent); }
.prose strong { color: var(--fg); font-weight: 700; }
.prose a { color: var(--accent); text-underline-offset: 3px; }
.prose :not(pre) > code { font-family: var(--font-mono); font-size: .86em; background: var(--accent-soft); padding: .1em .4em; border-radius: 4px; }
pre { margin: 0; overflow-x: auto; background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono);
  font-size: 13.5px; line-height: 1.7; padding: 16px 18px; tab-size: 2; }
pre code { font-family: inherit; }
.code-wrap { display: grid; min-width: 0; }
.code-label { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.k { color: var(--tk-k); } .s { color: var(--tk-s); } .c { color: var(--tk-c); font-style: italic; } .f { color: var(--tk-f); } .t { color: var(--tk-t); }
.icon-btn { background: none; border: 1px solid var(--line); color: var(--fg); width: 34px; height: 34px; border-radius: 50%;
  display: inline-grid; place-items: center; cursor: pointer; font-size: 15px; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ───────── A 編輯 ───────── */
.A { max-width: 680px; margin: 0 auto; }
.A .hdr { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 28px; flex-wrap: wrap; }
.A .brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-decoration: none; letter-spacing: .02em; }
.A .nav { display: flex; align-items: center; gap: 22px; font-size: 15px; }
.A .nav a { text-decoration: none; color: var(--muted); }
.A .nav a:hover, .A .nav a[aria-current] { color: var(--fg); }
.A .nav a[aria-current] { box-shadow: inset 0 -2px 0 var(--accent); }
.A .hero { padding-block: 56px 64px; display: grid; gap: 22px; }
.A .hero h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 7vw, 48px); line-height: 1.25; letter-spacing: .01em; }
.A .hero h1 em { font-style: normal; color: var(--accent); }
.A .hero p { font-size: 18px; color: var(--muted); max-width: 34em; }
.A .hero .links { display: flex; gap: 24px; flex-wrap: wrap; font-weight: 500; }
.A .hero .links a { color: var(--accent); text-decoration: none; }
.A .hero .links a:hover { text-decoration: underline; text-underline-offset: 4px; }
.A .sec-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: .25em; color: var(--muted); margin-bottom: 28px; }
.A .posts { display: grid; gap: 40px; }
.A .post-item { display: grid; gap: 8px; }
.A .post-item time { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.A .post-item h3 { font-family: var(--font-display); font-size: 23px; line-height: 1.45; font-weight: 700; }
.A .post-item h3 a { text-decoration: none; }
.A .post-item h3 a:hover { color: var(--accent); }
.A .post-item p { color: var(--muted); }
.A .tags { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
.A .tags a { color: var(--accent); text-decoration: none; }
.A .more { display: inline-block; margin-top: 48px; color: var(--accent); text-decoration: none; font-weight: 500; }
.A .page-head { padding-block: 40px 48px; display: grid; gap: 10px; }
.A .page-head h1 { font-family: var(--font-display); font-size: 36px; font-weight: 900; }
.A .page-head p { color: var(--muted); }
.A .year { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--line); margin: 8px 0 -16px; }
.A article.post header { padding-block: 40px 40px; display: grid; gap: 14px; text-align: center; justify-items: center; }
.A article.post h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(30px, 6vw, 40px); line-height: 1.35; }
.A .meta { color: var(--muted); font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.A .orn { color: var(--accent); letter-spacing: .6em; font-size: 12px; }
.A .prose h2 { font-family: var(--font-display); }
.A pre { border-radius: 6px; }
.A .ftr { margin-top: 96px; padding-block: 28px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.A .ftr nav { display: flex; gap: 18px; flex-wrap: wrap; }
.A .ftr a { text-decoration: none; } .A .ftr a:hover { color: var(--accent); }

/* ───────── B 工程筆記 ───────── */
.B { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; padding-top: 40px; }
.B .side { position: sticky; top: 40px; align-self: start; display: grid; gap: 28px; }
.B .brand { font-weight: 700; font-size: 17px; text-decoration: none; display: grid; gap: 2px; }
.B .brand small { font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--muted); }
.B .nav { display: grid; gap: 2px; font-size: 15px; }
.B .nav a { text-decoration: none; color: var(--muted); padding: 4px 10px; margin-left: -10px; border-radius: 6px; }
.B .nav a:hover { color: var(--fg); background: var(--surface); }
.B .nav a[aria-current] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.B .side-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.B .side-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.B .side-foot { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.B .side-foot a { text-decoration: none; } .B .side-foot a:hover { color: var(--accent); }
.B .tag { font-family: var(--font-mono); font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 4px; text-decoration: none; white-space: nowrap; }
.B main { min-width: 0; }
.B .hero { display: grid; gap: 14px; padding-bottom: 40px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
.B .hero .eyebrow { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.B .hero h1 { font-size: clamp(28px, 5vw, 36px); line-height: 1.35; font-weight: 700; letter-spacing: -.01em; }
.B .hero p { color: var(--muted); font-size: 17px; max-width: 36em; }
.B .hero .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.B .btn { font-size: 14px; text-decoration: none; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.B .btn:hover { border-color: var(--accent); color: var(--accent); }
.B .sec-title { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.B .rows { display: grid; }
.B .row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 20px; padding: 18px 0; border-bottom: 1px dashed var(--line); }
.B .row time { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 3px; }
.B .row h3 { font-size: 18px; line-height: 1.5; font-weight: 600; }
.B .row h3 a { text-decoration: none; } .B .row h3 a:hover { color: var(--accent); }
.B .row p { grid-column: 2; color: var(--muted); font-size: 15px; }
.B .row .tags { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.B .more { display: inline-block; margin-top: 24px; font-family: var(--font-mono); font-size: 14px; color: var(--accent); text-decoration: none; }
.B .page-head { display: grid; gap: 8px; padding-bottom: 20px; }
.B .page-head h1 { font-size: 30px; font-weight: 700; }
.B .page-head p { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.B .post-grid { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 48px; }
.B article.post { min-width: 0; max-width: 700px; }
.B article.post header { display: grid; gap: 12px; padding-bottom: 28px; margin-bottom: 32px; border-bottom: 1px solid var(--line); }
.B .crumb { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.B .crumb a { text-decoration: none; color: var(--accent); }
.B article.post h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.4; font-weight: 700; }
.B .meta { font-family: var(--font-mono); font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.B pre { border: 1px solid var(--line); border-radius: 0 0 8px 8px; }
.B .code-label { border: 1px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 6px 14px; background: var(--surface); }
.B .toc { position: sticky; top: 40px; align-self: start; font-size: 14px; display: grid; gap: 6px; border-left: 1px solid var(--line); padding-left: 16px; }
.B .toc a { text-decoration: none; color: var(--muted); } .B .toc a:hover { color: var(--accent); }
.B .mobile-hdr { display: none; }
@media (max-width: 900px) {
  .B { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 0; }
  .B .side { display: none; }
  .B .mobile-hdr { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px; margin-bottom: 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .B .mobile-hdr nav { display: flex; gap: 16px; font-size: 15px; align-items: center; }
  .B .mobile-hdr nav a { text-decoration: none; color: var(--muted); }
  .B .mobile-hdr nav a[aria-current] { color: var(--accent); }
  .B .post-grid { grid-template-columns: minmax(0, 1fr); }
  .B .toc { display: none; }
  .B .mobile-foot { display: grid; }
}
.B .mobile-foot { display: none; margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); gap: 6px; }
@media (max-width: 480px) { .B .row { grid-template-columns: minmax(0, 1fr); } .B .row p, .B .row .tags { grid-column: 1; } }

/* ───────── C 極簡現代 ───────── */
.C { max-width: 1040px; margin: 0 auto; }
.C .hdr { display: flex; justify-content: space-between; align-items: center; padding-block: 28px; gap: 16px; flex-wrap: wrap; }
.C .brand { font-weight: 800; font-size: 18px; letter-spacing: -.02em; text-decoration: none; }
.C .nav { display: flex; gap: 28px; align-items: center; font-size: 15px; }
.C .nav a { text-decoration: none; }
.C .nav a:hover { color: var(--accent); }
.C .nav a[aria-current] { color: var(--muted); }
.C .hero { padding-block: clamp(56px, 12vw, 120px) clamp(48px, 9vw, 96px); display: grid; gap: 28px; }
.C .hero h1 { font-size: clamp(38px, 8.5vw, 80px); line-height: 1.12; font-weight: 800; letter-spacing: -.03em; max-width: 12em; }
.C .hero p { font-size: clamp(17px, 2vw, 20px); color: var(--muted); max-width: 30em; }
.C .hero .links { display: flex; gap: 28px; flex-wrap: wrap; font-weight: 600; }
.C .hero .links a { color: var(--accent); text-decoration: none; }
.C .hero .links a:hover { text-decoration: underline; text-underline-offset: 5px; }
.C .sec { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; border-top: 1px solid var(--fg); padding-top: 20px; }
.C .sec-title { font-size: 14px; font-weight: 600; }
.C .list { display: grid; }
.C .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.C .item:first-child { padding-top: 0; }
.C .item h3 { font-size: clamp(20px, 2.6vw, 26px); line-height: 1.35; font-weight: 700; letter-spacing: -.01em; }
.C .item h3 a { text-decoration: none; } .C .item h3 a:hover { color: var(--accent); }
.C .item time { color: var(--muted); font-size: 14px; white-space: nowrap; padding-top: 6px; }
.C .item p { color: var(--muted); grid-column: 1; }
.C .item .tags { grid-column: 1; }
.C .tags { display: flex; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.C .tags a { text-decoration: none; } .C .tags a:hover { color: var(--accent); }
.C .more { display: inline-block; margin-top: 28px; font-weight: 600; color: var(--accent); text-decoration: none; }
.C .page-head { padding-block: 64px 48px; }
.C .page-head h1 { font-size: clamp(40px, 8vw, 72px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.C article.post { max-width: 680px; margin: 0 auto; }
.C article.post header { padding-block: 64px 48px; display: grid; gap: 20px; }
.C article.post h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.2; font-weight: 800; letter-spacing: -.025em; }
.C .meta { display: flex; gap: 16px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.C pre { border-radius: 0; border-left: 2px solid var(--fg); }
.C .ftr { margin-top: 120px; padding-block: 32px; border-top: 1px solid var(--fg); display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 24px; font-size: 14px; }
.C .ftr nav { display: flex; gap: 20px; flex-wrap: wrap; }
.C .ftr a { text-decoration: none; } .C .ftr a:hover { color: var(--accent); }
.C .ftr .muted { color: var(--muted); }
@media (max-width: 720px) { .C .sec, .C .ftr { grid-template-columns: minmax(0, 1fr); } .C .item { grid-template-columns: minmax(0, 1fr); } .C .item time { padding-top: 0; grid-row: 1; } }

/* ───────── 原型切換列（不屬於設計） ───────── */
.proto-bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--bar-bg); color: var(--bar-fg); font-family: -apple-system, system-ui, sans-serif; font-size: 13px; line-height: 1;
  display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
  max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; z-index: 50; }
.proto-bar button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
.proto-bar button:hover { background: rgba(127,127,127,.22); }
.proto-bar button[aria-pressed="true"] { background: var(--bar-active); color: var(--bar-active-fg); }
.proto-bar .lbl { min-width: 7.5em; text-align: center; font-weight: 600; padding: 0 4px; }
.proto-bar .sep { width: 1px; height: 18px; background: var(--bar-muted); opacity: .5; }
.proto-bar .tag-proto { color: var(--bar-muted); padding: 0 8px; font-size: 11px; letter-spacing: .08em; }
@media (max-width: 560px) { .proto-bar { border-radius: 18px; } .proto-bar .tag-proto { display: none; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

<div id="app"></div>

<nav class="proto-bar" aria-label="原型切換">
  <span class="tag-proto">PROTOTYPE</span>
  <button id="prev" aria-label="上一個方向">←</button>
  <span class="lbl" id="vlabel"></span>
  <button id="next" aria-label="下一個方向">→</button>
  <span class="sep"></span>
  <button data-page="home">首頁</button>
  <button data-page="list">文章列表</button>
  <button data-page="post">文章內頁</button>
  <span class="sep"></span>
  <button id="theme" aria-label="切換淺色或深色">◐ 主題</button>
  <button id="serif" hidden aria-pressed="true">宋體標題</button>
</nav>

<script>
const VARIANTS = [
  { key: "a", name: "A 編輯" },
  { key: "b", name: "B 工程筆記" },
  { key: "c", name: "C 極簡現代" },
];
const PAGES = ["home", "list", "post"];

const POSTS = [
  { title: "為什麼這個網站的文章寫在 git 裡", date: "2026-11-01", tags: ["meta"], desc: "用 MDX 和 pull request 管理內容，讓 AI 起草、由我審核。", real: true },
  { title: "用 Playwright 為靜態網站寫冒煙測試", date: "2026-10-24", tags: ["testing"], desc: "不測樣式，只測讀者會撞到的事：網址、轉址、410 和 RSS。" },
  { title: "讓 AI 代理遵守內容規則：從 frontmatter 驗證開始", date: "2026-10-15", tags: ["ai", "meta"], desc: "Writing Agent 交出的草稿，要先過哪些機器檢查才輪到我審閱。" },
  { title: "被移除的文章，網址該回 404 還是 410？", date: "2026-10-03", tags: ["nextjs"], desc: "兩者對搜尋引擎和讀者的意義不同，以及在 Next.js 裡怎麼做。" },
  { title: "把 RAG 放進客服流程前，我先問的三個問題", date: "2025-12-20", tags: ["ai"], desc: "資料多新、答錯的代價多大、誰來看沒回答的問題。" },
];
const ALL_TAGS = ["ai", "meta", "nextjs", "testing"];

const fmt = new Intl.DateTimeFormat("zh-TW", { dateStyle: "long", timeZone: "UTC" });
const fdate = (d) => fmt.format(new Date(d + "T00:00:00Z"));

const YAML = '<span class="c">---</span>\n<span class="f">title</span>: <span class="s">為什麼這個網站的文章寫在 git 裡</span>\n<span class="f">description</span>: <span class="s">用 MDX 和 pull request 管理內容，讓 AI 起草、由我審核。</span>\n<span class="f">date</span>: <span class="t">2026-11-01</span>\n<span class="f">tags</span>: [<span class="s">meta</span>]\n<span class="c">---</span>';
const TS = '<span class="k">const</span> dateFormat = <span class="k">new</span> Intl.<span class="f">DateTimeFormat</span>(<span class="s">"zh-TW"</span>, { dateStyle: <span class="s">"long"</span>, timeZone: <span class="s">"UTC"</span> });\n\n<span class="c">/** 把 YYYY-MM-DD 轉成讀者看的日期，例如 2026年10月1日。 */</span>\n<span class="k">export function</span> <span class="f">formatDate</span>(date: <span class="t">string</span>): <span class="t">string</span> {\n  <span class="k">return</span> dateFormat.<span class="f">format</span>(<span class="k">new</span> <span class="f">Date</span>(<span class="s">`${date}T00:00:00Z`</span>));\n}';

function body() {
  return `
  <p>這個網站的每一篇文章都是 repo 裡的一個 MDX 檔案，而不是存在 Hashnode 或 Ghost 這類平台上。</p>
  <h2 id="why">為什麼不用現成平台</h2>
  <ul>
    <li><strong>AI 擅長改檔案。</strong>讓 AI 起草文章時，最自然的工作方式就是在分支上改檔案，再開一個 pull request。</li>
    <li><strong>審核就是 code review。</strong>每一次變更都有完整的 diff 和歷史紀錄，合併之後才會上線。</li>
    <li><strong>MDX 可以嵌入元件。</strong>之後的互動 Demo 可以直接放進文章裡。</li>
  </ul>
  <h2 id="shape">一篇文章長什麼樣子</h2>
  <p>每篇文章開頭是一段 frontmatter，內容檢查會逐一驗證每個欄位：</p>
  <div class="code-wrap"><div class="code-label">content/posts/why-mdx-in-git/index.mdx</div><pre><code>${YAML}</code></pre></div>
  <p>讀者看到的日期，也是一個自己寫的小函式：</p>
  <div class="code-wrap"><div class="code-label">src/format-date.ts</div><pre><code>${TS}</code></pre></div>
  <h2 id="cost">代價</h2>
  <p>代價是少了平台本身的社群流量，需要的話可以手動轉貼並加上 <code>canonical</code> 網址。</p>`;
}

const navItems = (page) => [
  ["home", "首頁"], ["list", "文章"], ["tags", "標籤"], ["about", "關於"],
].filter(([k]) => k !== "home").map(([k, l]) => `<a href="#" data-go="${k}"${(page === k || (page === "post" && k === "list")) ? ' aria-current="page"' : ""}>${l}</a>`).join("");
const themeBtn = `<button class="icon-btn" data-toggle-theme aria-label="切換深淺色">◐</button>`;
const footLinks = `<a href="#">GitHub</a><a href="#">Email</a><a href="#">LinkedIn</a><a href="#">RSS</a>`;

/* ───── A 編輯 ───── */
function A(page) {
  const tagsA = (t) => `<span class="tags">${t.map((x) => `<a href="#">#${x}</a>`).join("")}</span>`;
  const item = (p) => `<li class="post-item"><time datetime="${p.date}">${fdate(p.date)}</time>
    <h3><a href="#" data-go="post">${p.title}</a></h3><p>${p.desc}</p>${tagsA(p.tags)}</li>`;
  let main = "";
  if (page === "home") main = `
    <section class="hero">
      <h1>寫軟體工程與 <em>AI 應用</em>的實作筆記。</h1>
      <p>嗨，我是 Duncan，一名軟體工程師。我在這裡記錄把 AI 落地到產品裡的做法，也展示我做過的東西。</p>
      <div class="links"><a href="#" data-go="about">關於我 →</a><a href="#">聯絡我 →</a></div>
    </section>
    <section><h2 class="sec-title">最新文章</h2><ul class="posts">${POSTS.map(item).join("")}</ul>
      <a class="more" href="#" data-go="list">所有文章 →</a></section>`;
  if (page === "list") {
    const byYear = {};
    POSTS.forEach((p) => (byYear[p.date.slice(0, 4)] ??= []).push(p));
    main = `<div class="page-head"><h1>文章</h1><p>共 ${POSTS.length} 篇，由新到舊。</p></div>
      <div class="posts">${Object.keys(byYear).sort().reverse().map((y) => `<div class="year">${y}</div><ul class="posts">${byYear[y].map(item).join("")}</ul>`).join("")}</div>`;
  }
  if (page === "post") main = `<article class="post"><header>
      <div class="orn">◆ ◆ ◆</div>
      <h1>${POSTS[0].title}</h1>
      <div class="meta"><time datetime="2026-11-01">${fdate("2026-11-01")}</time><span>·</span>${tagsA(["meta"])}</div>
    </header><div class="prose">${body()}</div></article>`;
  return `<div class="A">
    <header class="hdr"><a class="brand" href="#" data-go="home">Duncan Wen</a><nav class="nav">${navItems(page)}${themeBtn}</nav></header>
    <main>${main}</main>
    <footer class="ftr"><span>© 2026 Duncan Wen</span><nav>${footLinks}</nav></footer></div>`;
}

/* ───── B 工程筆記 ───── */
function B(page) {
  const tagsB = (t) => t.map((x) => `<a class="tag" href="#">#${x}</a>`).join("");
  const row = (p) => `<li class="row"><time datetime="${p.date}">${p.date}</time>
    <h3><a href="#" data-go="post">${p.title}</a></h3><p>${p.desc}</p><div class="tags">${tagsB(p.tags)}</div></li>`;
  let main = "";
  if (page === "home") main = `
    <section class="hero">
      <span class="eyebrow">// 軟體工程師 · 網頁開發 · AI 應用</span>
      <h1>嗨，我是 Duncan。<br>我把 AI 做進真的產品裡。</h1>
      <p>這裡是我的實作筆記：做法、踩過的坑、取捨的理由，也展示我做過的東西。</p>
      <div class="links"><a class="btn" href="#" data-go="about">關於我</a><a class="btn" href="#">聯絡我</a></div>
    </section>
    <h2 class="sec-title">最新文章</h2><ul class="rows">${POSTS.map(row).join("")}</ul>
    <a class="more" href="#" data-go="list">所有文章 →</a>`;
  if (page === "list") main = `<div class="page-head"><h1>文章</h1><p>${POSTS.length} 篇 · 最新 ${POSTS[0].date}</p></div>
    <ul class="rows">${POSTS.map(row).join("")}</ul>`;
  if (page === "post") main = `<div class="post-grid"><article class="post"><header>
      <div class="crumb"><a href="#" data-go="list">文章</a> / why-mdx-in-git</div>
      <h1>${POSTS[0].title}</h1>
      <div class="meta"><time datetime="2026-11-01">2026-11-01</time><span>約 2 分鐘</span>${tagsB(["meta"])}</div>
    </header><div class="prose">${body()}</div></article>
    <aside class="toc" aria-label="本文目錄"><div class="side-label">本文目錄</div>
      <a href="#why">為什麼不用現成平台</a><a href="#shape">一篇文章長什麼樣子</a><a href="#cost">代價</a></aside></div>`;
  return `<div class="B">
    <aside class="side">
      <a class="brand" href="#" data-go="home">Duncan Wen<small>軟體工程 × AI 應用</small></a>
      <nav class="nav"><a href="#" data-go="home"${page === "home" ? ' aria-current="page"' : ""}>首頁</a>${navItems(page)}</nav>
      <div><div class="side-label">標籤</div><div class="side-tags">${tagsB(ALL_TAGS)}</div></div>
      <div class="side-foot"><a href="#">github</a><a href="#">email</a><a href="#">linkedin</a><a href="#">rss</a><span>© 2026</span></div>
      <div>${themeBtn}</div>
    </aside>
    <main>
      <div class="mobile-hdr"><a class="brand" href="#" data-go="home">Duncan Wen</a><nav>${navItems(page)}${themeBtn}</nav></div>
      ${main}
      <footer class="mobile-foot"><div>github · email · linkedin · rss</div><div>© 2026 Duncan Wen</div></footer>
    </main></div>`;
}

/* ───── C 極簡現代 ───── */
function C(page) {
  const tagsC = (t) => `<div class="tags">${t.map((x) => `<a href="#">${x}</a>`).join("")}</div>`;
  const item = (p, withDesc) => `<li class="item"><h3><a href="#" data-go="post">${p.title}</a></h3>
    <time datetime="${p.date}">${fdate(p.date)}</time>${withDesc ? `<p>${p.desc}</p>${tagsC(p.tags)}` : ""}</li>`;
  let main = "";
  if (page === "home") main = `
    <section class="hero">
      <h1>我寫軟體工程與 AI 應用的實作筆記。</h1>
      <p>嗨，我是 Duncan Wen，專注在網頁開發與把 AI 落地到產品裡。</p>
      <div class="links"><a href="#" data-go="about">關於我</a><a href="#">聯絡我</a></div>
    </section>
    <section class="sec"><h2 class="sec-title">最新文章</h2>
      <div><ul class="list">${POSTS.map((p) => item(p, false)).join("")}</ul><a class="more" href="#" data-go="list">所有文章 →</a></div></section>`;
  if (page === "list") main = `<div class="page-head"><h1>文章</h1></div>
    <section class="sec"><h2 class="sec-title">${POSTS.length} 篇</h2><ul class="list">${POSTS.map((p) => item(p, true)).join("")}</ul></section>`;
  if (page === "post") main = `<article class="post"><header>
      <div class="meta"><time datetime="2026-11-01">${fdate("2026-11-01")}</time>${tagsC(["meta"])}</div>
      <h1>${POSTS[0].title}</h1>
      <p style="color:var(--muted);font-size:19px">${POSTS[0].desc}</p>
    </header><div class="prose">${body()}</div></article>`;
  return `<div class="C">
    <header class="hdr"><a class="brand" href="#" data-go="home">Duncan Wen</a><nav class="nav">${navItems(page)}${themeBtn}</nav></header>
    <main>${main}</main>
    <footer class="ftr"><span>Duncan Wen</span><nav>${footLinks}</nav><span class="muted">© 2026</span></footer></div>`;
}

const RENDER = { a: A, b: B, c: C };
const root = document.documentElement;
let state = { v: "a", page: "home" };

function readHash() {
  const m = /^#([abc])-(home|list|post)$/.exec(location.hash);
  if (m) state = { v: m[1], page: m[2] };
}
function render(scroll) {
  root.classList.remove("v-a", "v-b", "v-c");
  root.classList.add("v-" + state.v);
  document.getElementById("app").innerHTML = RENDER[state.v](state.page);
  document.getElementById("vlabel").textContent = VARIANTS.find((x) => x.key === state.v).name;
  document.querySelectorAll("[data-page]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.page === state.page)));
  document.getElementById("serif").hidden = state.v !== "a";
  const h = "#" + state.v + "-" + state.page;
  if (location.hash !== h) history.replaceState(null, "", h);
  if (scroll) window.scrollTo(0, 0);
}
function go(patch) { state = { ...state, ...patch }; render(true); }
function cycle(d) { const i = VARIANTS.findIndex((x) => x.key === state.v); go({ v: VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key }); }
function toggleTheme() {
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
}

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("theme").onclick = toggleTheme;
document.getElementById("serif").onclick = (e) => {
  const on = root.classList.toggle("no-serif") === false;
  e.currentTarget.setAttribute("aria-pressed", String(on));
  e.currentTarget.textContent = on ? "宋體標題" : "系統字標題";
};
document.querySelectorAll("[data-page]").forEach((b) => (b.onclick = () => go({ page: b.dataset.page })));
document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-go], [data-toggle-theme], a[href='#']");
  if (!t) return;
  if (t.matches("[data-toggle-theme]")) { toggleTheme(); return; }
  e.preventDefault();
  const g = t.dataset.go;
  if (PAGES.includes(g)) go({ page: g });
});
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
addEventListener("hashchange", () => { readHash(); render(true); });
readHash();
render(false);
</script>
