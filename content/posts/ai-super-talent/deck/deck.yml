slides:
  - title: "成為前 1% 的超級人才：AI 浪潮下的生存與破局之道" # 01.webp
    text: "副標題是「拒絕思維外包，掌握『問、用、管、造』的終極協作架構」。內容依據簡立峰博士《善用 AI 成為 1% 的超級人才》演講精華提煉。"
  - title: "時代的跳躍：從「對話」到「全自動代理」" # 02.webp
    text: "AI 正從對話模式的 Language Model，進化為全自動代理 Agentic AI。認知升級：AI 的邏輯推理與規劃能力已達博士級，例如 Gemini 從數學銀牌躍升至金牌，解開 ICPC 世界程式設計競賽難題。軟體已死：網頁與軟體不再是設計給人類使用，而是設計給 AI 代理（Agents）讀取。終極警訊：初階知識工作者面臨「降級（De-skill）」危機，人類若不進化，將淪為 AI 決策下的「手腳」。"
  - title: "最大的危機不是被取代，而是「思維外包」" # 03.webp
    text: "「如果你把思考外包給 AI，人類的大腦反而會退化。」退化分三步：先依賴單一問答（One-shot Prompt）尋求標準答案，接著失去批判思考與推演能力，最後喪失決策主體性，成為機器的單純執行端。真正的強者，是利用 AI 擴展大腦的邊界，而非將思考權讓渡給機器。"
  - title: "殘酷的底層邏輯：語言決定了你的 AI 智商" # 04.webp
    text: "AI 的底層架構是 Token，訓練資料中英文 Token 佔 70% 以上，簡體中文約 2%，繁體中文不到 0.01%。直接用繁中處理複雜邏輯，會導致 AI 出現「降智」與「失憶」。AI 邏輯最佳化流程：先將專業或複雜問題要求 AI 轉譯為英文思考，再讓 AI 在原生的英文神經網路中進行邏輯推演（Deep Thinking），最後將最精準的結果翻譯回繁體中文輸出。"
  - title: "階級重組：你在哪一個象限？" # 05.webp
    text: "99% 的平庸使用者與前 1% 的超級人才的對照。思維：前者尋找標準答案，後者尋找洞察、靈感與盲點。互動：前者一問一答，形同抄襲；後者十問十答，反覆迭代與共創。定位：前者是 AI 的操作員（Operator），後者是 AI 的管理者與架構師（Manager）。產出：前者節省時間、提早下班；後者打造分身（Agent），24 小時指數級擴增產出。"
  - title: "前 1% 人才的核心協作架構：問、用、管、造" # 06.webp
    text: "四個動作組成 1% 超級協作引擎。問（Ask）：精準提問，定義脈絡，Good answers come from smart ask。用（Use）：判斷場景，尋找人機協同最佳切入點。管（Manage）：流程品管，將自身升級為產品經理（PM）與品管（QA）。造（Create）：打造自動運轉的 AI 分身，實現 24 小時知識複利。"
  - title: "[問] Smart Ask：掌握定義脈絡的權力" # 07.webp
    text: "好的提問由四個部分組成。角色（Role）：賦予 AI 明確的專家視角。脈絡（Context）：完整提供人、事、時、地、物的背景限制。格式（Output）：指定輸出的精確結構，如表格、代碼、分析報告。專業限制（Precision）：使用行話與術語（Terminology），喚醒 AI 底層專業知識庫。"
  - title: "拒絕抄襲，內化創造力：十問十答迭代策略" # 08.webp
    text: "一問一答等於知識抄襲，十問十答等於認知內化。第一步拋出初始假設，詢問「我的思考脈絡有什麼盲點？」；第二步逼迫邊界，增加限制條件，迫使 AI 推理（Deep Thinking）；第三步反向詰問，要求 AI 提問，挖掘人類未曾設想的角度。注意 LLM 極限（百萬 Token 緩衝），適時要求 AI 輸出 Summary 並「重啟對話」以防失憶。"
  - title: "[用] 尋找絕佳切入點：人類的核心護城河" # 09.webp
    text: "以數位資訊密度、實體環境與情緒複雜度兩個軸區分工作。高資訊、低實體的工作，例如程式碼、資料分析、文案策劃，可全面交給 AI。高情緒、高實體的部分，例如水電師傅面對未知的耐受度、突發狀況 EQ、多感官綜合判斷，是人類不可取代的絕對領域。Takeaway：用 AI 處理 3000 種情境的資料檢索，讓人專注於「真實的情緒連結」。"
  - title: "[管] 職能重塑：從「執行者」升格為「品管與產品經理」" # 10.webp
    text: "職涯轉變：從單一技能執行，轉變為指揮 AI 協作的樞紐。人類作為 Human Manager 居中，指揮 AI Agent: Coder 與 AI Agent: Tester，並負責驗證與把關。品管（QA）：擁有辨識 AI 幻覺、錯誤與平庸產出的專業品味，核心價值轉為「驗證 Validation」與「架構把關」。產品經理（PM）：將龐大任務拆解為小模組，精準指派給不同專長的 AI 代理執行。"
  - title: "[造] 超級使用者時代：打造自動運轉的 AI 分身" # 11.webp
    text: "從「下班後自己熬夜學習」進化到「睡覺時讓 AI 幫你學習」。人類作為 Human Orchestrator，指揮多個分身：Agent A（專案統籌）指揮內部專案進度；Agent B（健康管理）整合智慧手錶數據與健康警示；Agent C（自動化研究）每日啟動 100 多個特定主題追蹤，自動比對趨勢並生成摘要。Goal：打破每日 24 小時的時間限制，建立個人專屬的自動化智庫。"
  - title: "組織解構：一人獨角獸（One-Person Unicorn）誕生" # 12.webp
    text: "一個人居中，周圍是 AI CFO、AI CTO 與 AI Marketing。宏觀趨勢：企業外包需求大幅下降，內部員工已能透過 AI 吸收基礎工作。案例研究：矽谷前產品總監，無需雇用人類工程師，與 7-8 個「AI 同事」協作，獨自建立並營運新創企業；虛擬自販機實驗中，AI 代理在 365 個虛擬天數中，自主發送 3000 封招商信件並獲利，全程無需人類干預。"
  - title: "終極型態：AI 時代的 π 型人才" # 13.webp
    text: "頂部橫樑是跨域整合與軟實力：「問、用、管、造」架構、同理心、領導力、跨領域協商。第一支柱是核心專業：內隱知識（Tacit Knowledge）、實體世界的物理感知。第二支柱是跨界視角：結合另一領域常識，利用 AI 填補技術落差，實現跨界應用創新。Key Insight：人類獨特的「廣度組合」與「實體感知」才是無法被爬蟲擷取的絕對優勢。"
  - title: "資源戰的底層邏輯：算力即知識（Compute is Knowledge）" # 14.webp
    text: "資本（算力）加上深度思考（迭代），等於指數級知識複利。產業轉型：知識型產業正在變成「製造業」，花越多算力讓機器推演，得到的知識越精準。1% 法則：這是一場資本與認知深度的雙重槓桿，掌握高階提問策略的人，將獲得指數級的知識產出。"
  - title: "你的故事才剛開始" # 15.webp
    text: "AI 已經讀完了人類一億本書，而你的故事才剛開始。不要害怕被取代，帶著你的專業與同理心，成為那個定義脈絡的發問者。The prompt is waiting. 你，要問什麼？"
