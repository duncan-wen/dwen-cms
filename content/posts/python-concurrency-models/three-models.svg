  <rect x="124" y="104" width="76" height="26" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="162" y="122" text-anchor="middle" font-size="13" fill="var(--ink)">記憶體</text>
  <rect x="124" y="138" width="76" height="26" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
