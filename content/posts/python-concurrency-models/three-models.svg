  <rect x="501" y="138" width="54" height="26" rx="6" fill="var(--paper)" stroke="var(--series-3)" stroke-width="1.5"/>
  <text x="528" y="156" text-anchor="middle" font-size="13" fill="var(--ink)">任務</text>
  <rect x="562" y="138" width="54" height="26" rx="6" fill="var(--paper)" stroke="var(--series-3)" stroke-width="1.5"/>
  <text x="589" y="156" text-anchor="middle" font-size="13" fill="var(--ink)">任務</text>
  <rect x="440" y="176" width="176" height="30" rx="6" fill="var(--series-3)"/>
  <text x="528" y="196" text-anchor="middle" font-size="13" fill="var(--on-accent)">事件迴圈</text>
