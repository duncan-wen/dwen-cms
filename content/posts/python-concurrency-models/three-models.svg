  <text x="432" y="266" font-size="13" fill="var(--ink)">遇到 await 才切換</text>
  <rect x="16" y="284" width="608" height="32" rx="6" fill="var(--accent-wash)"/>
  <text x="28" y="305" fill="var(--accent)">選哪一個，先看工作卡在 CPU 計算，還是卡在等待</text>
