<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-size="14">
  <text x="16" y="28" font-size="16" font-weight="600" fill="var(--ink)">三種模型：程式跑在哪裡、共用什麼</text>
