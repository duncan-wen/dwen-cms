  <rect x="16" y="582" width="308" height="52" rx="6" fill="var(--accent-wash)"/>
  <text x="28" y="603" fill="var(--accent)">選哪一個，先看工作卡在</text>
  <text x="28" y="625" fill="var(--accent)">CPU 計算，還是卡在等待</text>
