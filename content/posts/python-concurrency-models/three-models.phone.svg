  <text x="216" y="480" text-anchor="middle" font-size="13" fill="var(--ink)">任務</text>
  <rect x="252" y="462" width="60" height="26" rx="6" fill="var(--paper)" stroke="var(--series-3)" stroke-width="1.5"/>
