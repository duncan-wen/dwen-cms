  <rect x="182" y="106" width="64" height="26" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="214" y="124" text-anchor="middle" font-size="13" fill="var(--ink)">記憶體</text>
