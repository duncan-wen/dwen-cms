  <rect x="241" y="74" width="11" height="20" rx="6" fill="var(--series-2)"/>
  <text x="16" y="112" font-size="13" fill="var(--ink)">執行緒 2</text>
  <rect x="84" y="98" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
