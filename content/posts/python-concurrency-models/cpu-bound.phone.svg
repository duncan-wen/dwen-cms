  <text x="16" y="136" font-size="13" fill="var(--ink)">執行緒 3</text>
  <rect x="84" y="122" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
  <rect x="111" y="122" width="11" height="20" rx="6" fill="var(--series-2)"/>
  <rect x="163" y="122" width="11" height="20" rx="6" fill="var(--series-2)"/>
  <rect x="215" y="122" width="11" height="20" rx="6" fill="var(--series-2)"/>
  <rect x="267" y="122" width="11" height="20" rx="6" fill="var(--series-2)"/>
  <text x="16" y="160" font-size="13" fill="var(--ink)">執行緒 4</text>
  <rect x="84" y="146" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
