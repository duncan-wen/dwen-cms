  <rect x="84" y="290" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
  <rect x="84" y="290" width="56" height="20" rx="6" fill="var(--series-1)"/>
  <text x="152" y="257" font-size="13" fill="var(--ink-soft)">0.49 秒</text>
  <path d="M84 328 L292 328" stroke="var(--rule)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
