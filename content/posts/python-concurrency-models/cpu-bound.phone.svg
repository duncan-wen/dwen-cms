  <text x="292" y="182" text-anchor="end" font-size="13" fill="var(--ink-soft)">共 1.82 秒</text>
  <text x="16" y="206" font-weight="600" fill="var(--ink)">4 個行程（4 顆核心同時跑）</text>
  <text x="16" y="232" font-size="13" fill="var(--ink)">行程 1</text>
  <rect x="84" y="218" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
  <rect x="84" y="218" width="56" height="20" rx="6" fill="var(--series-1)"/>
  <text x="16" y="256" font-size="13" fill="var(--ink)">行程 2</text>
  <rect x="84" y="242" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
  <rect x="84" y="242" width="56" height="20" rx="6" fill="var(--series-1)"/>
  <text x="16" y="280" font-size="13" fill="var(--ink)">行程 3</text>
  <rect x="84" y="266" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
  <rect x="84" y="266" width="56" height="20" rx="6" fill="var(--series-1)"/>
