    </marker>
  </defs>
  <text x="16" y="28" font-size="16" font-weight="600" fill="var(--ink)">CPU 密集：執行緒 vs. 行程</text>
  <text x="16" y="62" font-weight="600" fill="var(--ink)">4 條執行緒（共用一把 GIL）</text>
  <text x="16" y="88" font-size="13" fill="var(--ink)">執行緒 1</text>
  <rect x="84" y="74" width="208" height="20" rx="6" fill="var(--paper-deep)"/>
