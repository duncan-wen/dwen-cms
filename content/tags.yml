# 核准的 Tag 清單。Tag 一律是小寫英文 kebab-case；新增 Tag 請在 PR 說明理由。
# 每個 Tag 後面的註解是它涵蓋的內容；意思相近的文章請沿用同一個 Tag。

# AI 與工具
- ai-agents     # AI 智能體：自己建的 Agent、工具呼叫、自動化流程
- mcp           # Model Context Protocol：接本機環境、自訂 MCP server
- claude-code   # Claude Code：skills、工作流程、實戰心得
- llm           # 大型語言模型：DeepSeek、Claude 等模型的使用與比較
- rag           # 檢索增強生成：知識庫、向量搜尋、文件問答

# 工程技術
- web-dev       # 網頁開發：Next.js、前端、這個網站的做法
- python        # Python：非同步、腳本、後端
- go            # Go：goroutine、channel、並行與後端服務
- architecture  # 系統架構：設計思維、取捨、架構圖
- devops        # 部署與維運：CI、Vercel、自動化

# 投資與生活
- trading       # 交易：期貨、交易系統、程式交易
- investing     # 投資理財：股市、線型與心態
- family        # 家庭生活：下廚、陪小孩、旅行與日常
- reflections   # 心情：職涯起伏、生活感悟
- sharing       # 分享：好用的工具、資源與推薦

# 寫作與其他
- tutorial      # 教學：一步一步跟著做的文章
- side-project  # 個人專案：自己做的工具與作品
- meta          # 本站幕後：這個網站本身怎麼做的
